<style>

<body>

<div class="container">
    <h2>For you 💕</h2>

<script>
const content = `
            Anh cảm thấy kiểu mối quan hệ của mình chưa giống người yêu lắm ấy nên anh nghĩ có vài điều chúng ta cần sửa nha.
            Đầu tiên là cách xưng hô nên thay đổi này. 
            
            Tiếp theo là anh thấy có nhiều mối quan hệ mà em có thể nhìn bằng lợi ích, nhìn một cách lý tính nhưng mà tình yêu thì anh nghĩ không nên thế.
            Vì yêu là cảm xúc, yêu bắt đầu từ những hảo cảm, những điều nhỏ bé góp nhặt thành.
            Như anh yêu em từ một chút lại một chút hảo cảm được tạo ra mỗi lần chúng ta gặp nhau.
            Yêu từ những khoảnh khắc chúng ta cùng trải qua, từ những cảm xúc mà em cho anh, yêu những thứ anh cảm nhận được ở em.
            Yêu từ cách em để tâm, nhớ và biết những gì anh thích, anh rất trân trọng những điều đó.
            Và hơn hết anh yêu con người em, yêu cả những ưu và khuyết điểm.
            Em có những mặt tốt cũng như một số tính xấu, những điều chưa hoàn hảo.
            Nhưng tất cả điều đó tạo nên một em rất hoàn hảo và hơn nữa em còn nỗ lực để bản thân trở nên tốt hơn từng ngày.
            Và còn rất rất rất nhiều điều nữa, anh luôn để ý và gom góp những điều nhỏ bé, những hành động như thế.
            Đến lúc tất cả mọi thứ trở nên to lớn và không giấu được nữa thì anh biết anh yêu em, đó không phải cảm xúc nhất thời hay bất chợt gì cả.
            Đơn giản đó là cảm xúc của anh, anh cảm thấy nhớ em, suy nghĩ về em, lúc đó anh biết anh yêu em rồi.
            Anh nghĩ là tình yêu có thể đem lại lợi ích cho nhau.
            Nhưng anh mong em biết rằng yêu có thể lý tính nhưng đừng quá lý tính và chỉ nhìn vào những lợi ích mà người khác đem lại cho mình.
            Vì yêu còn là cảm xúc, là những điều em không giải thích, không thể chứng minh, càng không thể hiểu được, yêu đơn giản là yêu thôi.
            Đến những thời điểm chúng ta không thể đem lại những lợi ích ngắn hạn cho nhau nữa nhưng chúng ta vẫn kiên định chọn ở lại.
            Anh nghĩ đó mới là yêu, khi anh yêu một người anh chưa từng tính toán lợi ích, thiệt hơn hay được mất,... có lẽ đó là cách yêu của anh.
            Nên là anh mong em thử một lần bỏ qua lý trí để cảm nhận mọi thứ bằng con tim.
            Cảm nhận về anh và về mối quan hệ này chỉ bằng cảm xúc của bản thân, anh nghĩ lúc đó em sẽ biết em muốn gì.
            
            Tiếp theo nữa là anh nghĩ em chưa yêu anh, ít nhất bây giờ thì chưa.
            Thời điểm đó anh đã nói rồi, anh không nghĩ là em sẽ đồng ý lời tỏ tình, lúc đó a chỉ muốn bày tỏ tình cảm cho em biết thôi.
            Anh nghĩ em có đôi chút thích anh nhưng em rất yêu bản thân mình.
            Nên là em cứ làm chính mình thôi, làm những điều em thích, trở thành phiên bản em muốn trở thành.
            Anh yêu con người em, yêu tất cả phiên bản của em.
            Nên là em không cần làm những điều anh thích hay trở thành con người mà em nghĩ anh sẽ thích.
            Vì anh đã yêu em rồi thì em có làm gì hay trở nên thế nào đi chăng nữa thì anh cũng vẫn yêu em thôi.
            Anh muốn em cảm thấy thoải mái khi ở bên anh, là chính mình thôi.
            
            Em nói trước tuổi 25 mọi mối quan hệ của con trai chỉ là thử thôi nên anh nghĩ em có chút không trân trọng mốt quan hệ này lắm.
            Nhưng mà không sao, đến cược một chút đi, anh sẽ chứng minh cho em đây không phải phép thử.
            Anh không dám hứa là anh hoàn hảo và mối quan hệ này sẽ không kết thúc vì mốt điều gì đó anh không biết.
            Nhưng anh dám đảm bảo với em là hành trình này sẽ trọn vẹn, em sẽ không cảm thấy em sai khi chọn yêu anh.
            Vì anh yêu bằng tất cả những gì anh có, không hối hận, không tiếc nuối.
            Anh hoàn toàn nghiêm túc với việc này.
            Anh đã trải qua nhiều mối quan hệ, đều vụn vỡ vì nhiều lý do.
            Đôi khi anh mệt mỏi, anh không muốn bắt đầu thêm lần nào nữa nên đôi lúc anh quên mất cách bày tỏ cảm xúc, cách nói những điều mình nghĩ.
            Quên cả cách chia sẻ những thứ anh không muốn ai biết, những câu chuyện riêng tư nên đôi lúc anh ngu ngốc mong em thông cảm.
            Có thể em khó chịu vì anh từng có nhiều người yêu cũ.
            Thật ra thì anh có thể social engineering với tất cả mọi người, không cho họ biết con người thật của anh và anh từng làm thế.
            Anh có thể xây dựng cho em hình tượng anh hoàn hảo, không để em biết những sai lầm, bí mật, khuyết điểm hay những nỗi sợ anh giấu kĩ.
            Nhưng anh không muốn làm như thế nữa, anh nghĩ em nên được biết tất cả mọi thứ, anh nghĩ anh nên thành thật với người anh yêu thương.
            
            Còn về việc have sex trước hôn nhân, nhìn nhận một cách nghiêm túc thì anh không có vấn đề gì với điều đó lắm.
            Anh chỉ là không thích điều đó xảy ra trước hôn nhân.
            Trước giờ anh vẫn luôn nghĩ là NẾU anh và người anh yêu không thể đồng hành cùng nhau cả đời.
            Thì việc have sex sẽ rất thiệt thòi cho người con gái và có thể là cả người yêu tương lai của họ.
            Em nói trước 25 tuổi thì mọi mối quan hệ của con trai đều là phép thử, vậy tại sao em lại muốn trao thân mình trong một phép thử?
            Thật ra thì quyền quyết định là ở em, và nếu em muốn điều đó thì có thể thôi.
            Nhưng nếu có thể thì anh muốn chuyện đó xảy ra khi ta không coi nhau là một phép thử, hoặc là khi anh 25 tuổi - khi mà em cho là anh đã trưởng thành.
            Vì đơn giản nếu có thể, anh muốn đồng hành cùng em cả cuộc đời này chứ không phải một khoảnh khắc hay một đoạn đường.

            Có lẽ bây giờ em chỉ có đôi chút thích anh, nhưng anh tin là anh có thể làm cho em yêu anh.
            Và đến một thời điểm nào đó, em cảm thấy em nhớ anh thì em hãy nói với anh điều đó.
            Anh sẽ đến bên em dù có là bao xa, chỉ cần em muốn là được.
            Anh chưa từng quan tâm, cưng chiều ai như vậy, có lẽ do em nhỏ hơn, hoặc anh yêu em, hoặc là cả hai điều đó.
            Nên đôi lúc anh có chút vụng về, không biết cách thể hiện cảm xúc thì mong em thông cảm.
            Đơn giản là anh yêu em. 💖
`;

let i = 0;
const speed = 50;

function typeWriter(){
    if(i < content.length){
        document.getElementById("text").innerHTML += content.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }
}

typeWriter();
</script>

</body>
</html>
